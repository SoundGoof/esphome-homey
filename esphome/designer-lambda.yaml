  // Post-export edit: blank the panel when Homey has switched the display off,
  // before the generated code draws anything. ePaper holds its last image with
  // no power, so sleeping without clearing would leave stale data on screen.
  if (!id(display_on)) {
    it.fill(Color(255, 255, 255));
    return;
  }
  const auto COLOR_WHITE = Color(0, 0, 0); // Inverted for e-ink
  const auto COLOR_BLACK = Color(255, 255, 255); // Inverted for e-ink
  auto color_off = COLOR_WHITE;
  auto color_on = COLOR_BLACK;

  // Helper to print text with word-wrap at widget boundary
  auto print_wrapped_text = [&](int x, int y, int max_w, int line_h, esphome::font::Font *font, Color color, TextAlign align, const char* text) {
    if (!text || max_w <= 0) return;
    int cx = x;
    int cy = y;
    std::string line;
    std::string word;
    const char* p = text;
    while (*p) {
      bool is_space = (*p == ' ' || *p == '\n' || *p == '\r' || *p == '\t');
      if (is_space) {
        if (!word.empty()) {
          int ww, wh, wbl, wx;
          font->measure(word.c_str(), &ww, &wx, &wbl, &wh);
          int lw = 0, lx;
          if (!line.empty()) { font->measure(line.c_str(), &lw, &lx, &wbl, &wh); int sw, sx, sbl, sh; font->measure(" ", &sw, &sx, &sbl, &sh); lw += sw; }
          if (lw + ww > max_w && !line.empty()) {
            it.print(cx, cy, font, color, align, line.c_str());
            cy += line_h;
            line = word;
          } else {
            if (!line.empty()) line += " ";
            line += word;
          }
          word.clear();
        }
      } else {
        word += *p;
      }
      p++;
    }
    if (!word.empty()) {
      int ww, wh, wbl, wx;
      font->measure(word.c_str(), &ww, &wx, &wbl, &wh);
      int lw = 0, lx;
      if (!line.empty()) { font->measure(line.c_str(), &lw, &lx, &wbl, &wh); int sw, sx, sbl, sh; font->measure(" ", &sw, &sx, &sbl, &sh); lw += sw; }
      if (lw + ww > max_w && !line.empty()) {
        it.print(cx, cy, font, color, align, line.c_str());
        cy += line_h;
        line = word;
      } else {
        if (!line.empty()) line += " ";
        line += word;
      }
    }
    if (!line.empty()) {
      it.print(cx, cy, font, color, align, line.c_str());
    }
  };
  int currentPage = id(display_page);
  if (currentPage == 0) {
    it.fill(COLOR_BLACK);
    color_off = COLOR_BLACK;
    color_on = COLOR_WHITE;
