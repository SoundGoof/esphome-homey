  // Blank the panel when Homey has switched the display off, before anything is
  // drawn. ePaper holds its last image with no power, so sleeping without
  // clearing would leave stale data on screen.
  if (!id(display_on)) {
    it.fill(Color(255, 255, 255));
    return;
  }
  const auto COLOR_WHITE = Color(0, 0, 0);
  const auto COLOR_BLACK = Color(255, 255, 255);
  auto color_off = COLOR_WHITE;
  auto color_on = COLOR_BLACK;

  auto print_wrapped_text = [&](int x, int y, int max_w, int line_h, esphome::font::Font *font, Color color, TextAlign align, const char* text) {
    if (!text || max_w <= 0) return;
    int cy = y;
    std::string line, word;
    const char* p = text;
    auto flush_word = [&]() {
      if (word.empty()) return;
      int ww, wh, wbl, wx;
      font->measure(word.c_str(), &ww, &wx, &wbl, &wh);
      int lw = 0, lx;
      if (!line.empty()) {
        font->measure(line.c_str(), &lw, &lx, &wbl, &wh);
        int sw, sx, sbl, sh;
        font->measure(" ", &sw, &sx, &sbl, &sh);
        lw += sw;
      }
      if (lw + ww > max_w && !line.empty()) {
        it.print(x, cy, font, color, align, line.c_str());
        cy += line_h;
        line = word;
      } else {
        if (!line.empty()) line += " ";
        line += word;
      }
      word.clear();
    };
    while (*p) {
      if (*p == ' ' || *p == '\n' || *p == '\r' || *p == '\t') flush_word();
      else word += *p;
      p++;
    }
    flush_word();
    if (!line.empty()) it.print(x, cy, font, color, align, line.c_str());
  };
  int currentPage = id(display_page);
  if (currentPage == 0) {
    it.fill(COLOR_BLACK);
    color_off = COLOR_BLACK;
    color_on = COLOR_WHITE;
