# Seeed reTerminal E1003 — minimal hardware bring-up.
#
# Purpose: prove the panel drives under ESPHome before any Homey slot
# machinery exists. Touch (gt911), SHT4x and the buttons are deliberately
# left out — add them once the screen is confirmed working.
#
# Requires ESPHome >= 2026.7.0 for the it8951 platform.

substitutions:
  name: reterminal-e1003
  friendly_name: reTerminal E1003
  # NTP source, used when the DHCP server does not advertise one (option 42).
  # Must be reachable without internet access — a router or a LAN NTP host.
  ntp_server: 10.255.248.1

packages:
  homey_slots: !include homey-slots.package.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # The profile marks this board batteryEnableAlwaysOn: without this the ADC
    # sits at 0 V because the divider is never powered.
    - priority: 600
      then:
        - output.turn_on: battery_enable
    # While on, never sleep. While off, the node still wakes on the deep_sleep
    # interval and stays up for run_duration, which is the window Homey has to
    # switch it back on — a sleeping node has no radio and cannot be reached.
    - priority: -100
      then:
        # Never sleep unless sleeping is enabled AND the display is off. If
        # sleeping is off the display is forced back on, so a node that cannot
        # sleep can never be left blank and unreachable.
        - if:
            condition:
              lambda: return !id(sleep_enabled) || id(display_on);
            then:
              - deep_sleep.prevent: deep_sleep_control
              - lambda: |-
                  if (!id(sleep_enabled) && !id(display_on)) {
                    id(display_on) = true;
                    id(display_power).publish_state(true);
                  }
  # device_info.model is hardcoded to the `board:` value by ESPHome and cannot
  # be overridden, so project.name is the only stable identifier the Homey
  # driver can filter on (BrandProfile.projects / projectPrefix). Without it
  # project_name is empty and accepts_project() rejects the node once the
  # driver profile declares any filter. Name must contain exactly one dot.
  #
  # The namespace is the integration, NOT the hardware vendor: `project.name` has
  # no registry, so `seeed.*` is Seeed's to use. Their official E1003 firmware
  # would then match this driver's filter while declaring none of the homey_*
  # slots or actions — pairing would succeed and every display Flow would
  # silently do nothing. Matching on the integration keeps the filter a claim
  # about the slot contract, which is what the driver actually requires.
  project:
    name: esphome-homey.RETERMINAL-E1003
    version: "0.1.0"

esp32:
  board: esp32-s3-devkitc-1
  # The board has 32MB flash, but declaring 32MB together with `ota:` requires
  # esp32.framework.advanced.enable_idf_experimental_features. 16MB avoids the
  # experimental path and is still ~10x more than this firmware uses.
  flash_size: 16MB
  framework:
    type: esp-idf

# OPI PSRAM is mandatory — the 1872x1404 framebuffer does not fit without it.
psram:
  mode: octal
  speed: 80MHz

logger:
  # The board exposes a single USB port wired to a CH340 UART bridge, not the
  # ESP32-S3's native USB. ESPHome would otherwise default the esp-idf console
  # to USB_SERIAL_JTAG, which nothing on this board is connected to.
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name} setup

captive_portal:

# Onboard SHT4x. GT911 touch shares this bus at 0x5D; the SHT4x is at its
# default 0x44.
i2c:
  id: bus_a
  sda: GPIO19
  scl: GPIO20

sensor:
  - platform: adc
    id: battery_voltage
    name: "Battery voltage"
    pin: GPIO1
    attenuation: 12db
    update_interval: 300s
    accuracy_decimals: 2
    unit_of_measurement: "V"
    filters:
      - multiply: 2.0

  # Derived from the voltage rather than polled on its own timer, so it updates
  # when a reading arrives instead of racing it. 3.27-4.15V is the Designer
  # profile's calibration for the cell on this board.
  - platform: copy
    source_id: battery_voltage
    id: battery_level
    name: "Battery"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 3.27 -> 0
          - 4.15 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  # Diagnostic: signal strength, and a human-readable version of it.
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi signal"
    update_interval: 120s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_rssi
    name: "WiFi quality"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - calibrate_linear:
          - -90 -> 0
          - -30 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  - platform: sht4x
    i2c_id: bus_a
    update_interval: 60s
    temperature:
      id: sht_temperature
      name: "Temperature"
      accuracy_decimals: 1
      filters:
        # The sensor sits next to the SoC and reads well above room
        # temperature. The offset is a number entity so it can be trimmed from
        # Homey without reflashing.
        - lambda: |-
            const float offset = id(temp_offset).state;
            return std::isnan(offset) ? x : x + offset;
    humidity:
      id: sht_humidity
      name: "Humidity"
      accuracy_decimals: 0

# Battery sense is gated by an enable pin, held on because the profile marks
# this board batteryEnableAlwaysOn. The ADC reads half the pack voltage through
# a divider, hence the 2.0 multiplier; 3.27-4.15V is the profile's calibration
# for a single cell, mapped to 0-100%.
output:
  - platform: gpio
    id: battery_enable
    pin: GPIO40

  # GPIO45 is an ESP32-S3 strapping pin; it is the buzzer on this board, and
  # driving it after boot is fine — the warning at validation is expected.
  - platform: ledc
    id: buzzer_output
    pin: GPIO45

  # Not in the Designer profile; taken from Seeed's ESPHome cookbook.
  - platform: gpio
    id: led_output
    pin: GPIO16

light:
  - platform: binary
    id: status_led
    name: "LED"
    output: led_output

deep_sleep:
  id: deep_sleep_control
  # Only reached when the display is switched off. run_duration is the awake
  # window per wake: long enough to associate, connect and be told to turn on.
  sleep_duration: 15min
  run_duration: 60s

switch:
  - platform: template
    id: display_power
    name: "Display"
    lambda: return id(display_on);
    turn_on_action:
      - globals.set:
          id: display_on
          value: "true"
      - deep_sleep.prevent: deep_sleep_control
      - component.update: epaper_display
    turn_off_action:
      - globals.set:
          id: display_on
          value: "false"
      # Draw the blank page first: the panel holds its last image with no
      # power, so sleeping without clearing leaves stale data on screen.
      - component.update: epaper_display
      - if:
          condition:
            lambda: return id(sleep_enabled);
          then:
            - delay: 8s
            - deep_sleep.enter: deep_sleep_control

  - platform: template
    id: sleep_switch
    name: "Sleep when display off"
    lambda: return id(sleep_enabled);
    entity_category: config
    turn_on_action:
      - globals.set:
          id: sleep_enabled
          value: "true"
    turn_off_action:
      - globals.set:
          id: sleep_enabled
          value: "false"
      - deep_sleep.prevent: deep_sleep_control

number:
  - platform: template
    id: temp_offset
    name: "Temperature offset"
    unit_of_measurement: "°C"
    min_value: -25
    max_value: 25
    step: 0.1
    initial_value: 0
    restore_value: true
    optimistic: true
    mode: box
    # Configuration, not a reading: the Homey driver keeps CONFIG entities off
    # the tile unless the device's "show configuration" setting is enabled,
    # which is where a calibration trim belongs.
    entity_category: config

rtttl:
  id: buzzer
  output: buzzer_output

spi:
  id: epaper_spi_bus
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8

# The generated lambda switches on a page index; a single page keeps it at 0.
globals:
  # Survives deep sleep and power loss, so the panel comes back in the state
  # Homey last set rather than defaulting on.
  - id: display_on
    type: bool
    restore_value: true
    initial_value: "true"

  # Deep sleep is opt-in. On USB the node should stay awake and reachable, and
  # an unconditional sleep is unrecoverable: switching the display off once
  # persists through restore_value, so every later boot slept before anything
  # could switch it back on — including builds with no switch at all.
  - id: sleep_enabled
    type: bool
    restore_value: true
    initial_value: "false"

  - id: display_page
    type: int
    restore_value: false
    initial_value: "0"

# The Designer lambda calls id(ha_time).now() for its clock widgets.
#
# NTP never points at the internet.
#
# Set ${ntp_server} to a server reachable without internet access — a router or
# a LAN NTP host. It must be set per network.
#
# Do NOT enable CONFIG_LWIP_DHCP_GET_NTP_SRV to pick the server up from DHCP
# option 42: ESPHome calls sntp_servermode_dhcp() from wifi_sta_ip_config_()
# without holding the lwIP core lock, so lwIP asserts and the node panics on
# every wifi connect ("Required to lock TCPIP core functionality!"), boot-loops,
# and the bootloader rolls back to the previous image. Verified on 2026-08-19
# with ESPHome 2026.7.4.
# SNTP is set up before wifi is connected, so its first poll always fails, and
# on ESP32 SNTPComponent::update() is a no-op (the re-sync is guarded by
# `#if !defined(USE_ESP32)`). Nothing retries, so the clock sits at 1970 until
# esp_sntp's own interval elapses. SNTPComponent::setup() is idempotent — it
# stops SNTP, re-applies servers and interval, then re-inits — so calling it
# once the network is up is the re-sync ESPHome does not do here.
interval:
  - interval: 30s
    then:
      - lambda: |-
          // Unresolved: the node still does not sync. The server answers (a
          // plain NTP query to 10.255.248.1 returns correct time) and this
          // lambda is compiled in, but no sync ever completes. Left in place
          // because it is harmless; the clock reads 1970 until this is chased.
          if (!id(ha_time).now().is_valid())
            id(ha_time).setup();

time:
  - platform: sntp
    id: ha_time
    timezone: Europe/Amsterdam
    # SNTP starts before wifi is up, so the first poll always fails. On ESP32
    # SNTPComponent::update() is a no-op (the re-sync is #if !defined(USE_ESP32)),
    # and ESPHome only passes this interval to esp_sntp_set_sync_interval() once
    # at setup. Left at the lwIP default the retry is an hour away, which leaves
    # the clock at 1970 and every datetime widget showing epoch.
    update_interval: 60s
    servers:
      - ${ntp_server}

# All font files are local — no gfonts:// and no type: web, so a build needs no
# internet. Run ./setup-fonts.sh once per checkout to populate fonts/ from
# files already on the machine; the binaries are deliberately not in git.
font:

  # Faces below are referenced by id from the Designer-generated lambda. Their
  # names encode family, weight and size, so these must track the font sizes set
  # on the widgets in reterminal_layout_*.json — change a size there and the
  # export references a font id that must exist here.
  #
  # sensor_text: label_font_size / value_font_size
  - file: "fonts/Roboto-Regular.ttf"
    id: font_roboto_400_32
    size: 32
  - file: "fonts/Roboto-Regular.ttf"
    id: font_roboto_400_44
    size: 44
  - file: "fonts/Roboto-Regular.ttf"
    id: font_roboto_400_110
    size: 110
  - file: "fonts/Roboto-Regular.ttf"
    id: font_roboto_400_130
    size: 130
  - file: "fonts/Roboto-Bold.ttf"
    id: font_roboto_700_72
    size: 72
  # datetime: date_font_size (regular) / time_font_size (bold)
  - file: "fonts/Roboto-Regular.ttf"
    id: font_roboto_400_48
    size: 48
  - file: "fonts/Roboto-Bold.ttf"
    id: font_roboto_700_120
    size: 120
  # Sizes from the previous layout, kept so the current designer-lambda.yaml
  # still compiles. Remove them once the lambda has been regenerated from the
  # resized layout and no longer references these ids.

  # weather_icon: size
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_material_design_icons_400_260
    size: 260
    glyphs:
      - "\U000F0026"  # exceptional
      - "\U000F0590"  # cloudy
      - "\U000F0591"  # fog
      - "\U000F0592"  # hail
      - "\U000F0593"  # lightning
      - "\U000F0594"  # clear-night
      - "\U000F0595"  # partlycloudy
      - "\U000F0596"  # pouring
      - "\U000F0597"  # rainy
      - "\U000F0598"  # snowy
      - "\U000F0599"  # sunny
      - "\U000F059D"  # windy
      - "\U000F059E"  # windy-variant
      - "\U000F0625"  # fallback / unknown
      - "\U000F067E"  # lightning-rainy
      - "\U000F067F"  # snowy-rainy
      - "\U000F0F31"  # partlycloudy-night

display:
  - platform: it8951
    id: epaper_display
    spi_id: epaper_spi_bus
    model: seeed-reterminal-e1003
    # The model preset already supplies dimensions, busy/reset/cs/enable pins,
    # vcom, vcom_register, force_temperature and mirror_x. Do not restate them.
    update_interval: 300s
    full_update_every: 30
    grayscale: true
    dithering: true
    update_mode: GC16
    # The render code is the Designer export, kept in its own file so updating
    # the layout is a file replacement rather than surgery on this one: design
    # in Designer, click the lambda copy button, overwrite designer-lambda.yaml
    # keeping its leading `|-` and two-space indent.
    #
    # Still needed after each regeneration until fixed in the layout itself:
    #   1. homey_t_weather_txt -> homey_t_weather, and delete the
    #      `text_sensor: platform: homeassistant` block Designer emits for it.
    #      The weather_icon widget ignores `is_local_sensor` (it always emits an
    #      HA platform sensor), so this one cannot be fixed in the layout. Its
    #      entity_id is set to homey_t_weather so the generated id is a
    #      predictable one-token rename rather than Designer's HA default.
    lambda: !include designer-lambda.yaml
