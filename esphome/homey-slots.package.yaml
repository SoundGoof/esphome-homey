# Homey slot contract — device-agnostic, include via `packages:`.
#
# Homey drives ESPHome displays through user-defined API actions because
# ESPHome's `display:` is not a native-API entity: no capability mapping can
# reach a screen. Values arrive as actions, land in template sensors ("slots"),
# and the display lambda renders whatever the slots currently hold.
#
# Slots are deliberately NOT `internal:`. ESPHome's `internal:` hides an entity
# from the native API entirely — it never appears in list_entities_services() —
# so internal slots would be undiscoverable and Homey's autocomplete would have
# no source. Hide them from the device tile with the driver's `hiddenEntities`
# compose key instead, which separates "exposed over API" from "shown on tile".
#
# Two dispatching actions rather than one action per field, and the dispatch is
# by runtime lookup rather than a hardcoded if-chain: adding a slot means adding
# a template sensor and nothing else. No lambda edit, no app change, no re-pair.
#
# The slot prefix must be on `name:`, not `id:`. ESPHome derives the native-API
# `object_id` from the entity name (slugified); the YAML `id:` is compile-time
# only and never crosses the API. Naming a slot "Slot text 1" yields object_id
# `slot_text_1`, which no prefix rule can match. The names are therefore the
# slot ids themselves — they are hidden from the Homey tile via `hiddenEntities`,
# so their unfriendliness never reaches a user.

substitutions:
  # Fallback unit per slot, drawn until Homey writes one. A node whose slot
  # always shows the same kind of reading can set these in its own config and
  # leave the unit out of the Flow entirely.
  slot1_unit: ""
  slot2_unit: ""
  slot3_unit: ""
  slot4_unit: ""
  slot5_unit: ""
  slot6_unit: ""
  # Override in the device YAML if the display component uses a different id.
  homey_display_id: epaper_display
  # Must match the driver's `displaySlots` compose key on the Homey side.
  homey_text_prefix: homey_t_
  # Longest slot text the node accepts. The display lambda formats into a
  # fixed buffer, so this must stay well under its size.
  homey_text_max: "192"
  homey_number_prefix: homey_n_

text_sensor:
  - platform: template
    id: homey_t_headline
    name: "homey_t_headline"
    update_interval: never

  - platform: template
    id: homey_t_subline
    name: "homey_t_subline"
    update_interval: never

  - platform: template
    id: homey_t_note
    name: "homey_t_note"
    update_interval: never

  # Drives the weather_icon widget: Homey pushes a Home Assistant-style
  # condition string ("sunny", "rainy", "partlycloudy", ...).
  - platform: template
    id: homey_t_weather
    name: "homey_t_weather"
    update_interval: never

  # Captions for the three value columns, pushed alongside the numbers.
  - platform: template
    id: homey_t_slot1_caption
    name: "homey_t_slot1_caption"
    update_interval: never

  - platform: template
    id: homey_t_slot2_caption
    name: "homey_t_slot2_caption"
    update_interval: never

  - platform: template
    id: homey_t_slot3_caption
    name: "homey_t_slot3_caption"
    update_interval: never

  - platform: template
    id: homey_t_slot4_caption
    name: "homey_t_slot4_caption"
    update_interval: never

  - platform: template
    id: homey_t_slot5_caption
    name: "homey_t_slot5_caption"
    update_interval: never

  - platform: template
    id: homey_t_slot6_caption
    name: "homey_t_slot6_caption"
    update_interval: never

  - platform: template
    id: homey_t_slot1_unit
    name: "homey_t_slot1_unit"
    update_interval: never

  - platform: template
    id: homey_t_slot2_unit
    name: "homey_t_slot2_unit"
    update_interval: never

  - platform: template
    id: homey_t_slot3_unit
    name: "homey_t_slot3_unit"
    update_interval: never

  - platform: template
    id: homey_t_slot4_unit
    name: "homey_t_slot4_unit"
    update_interval: never

  - platform: template
    id: homey_t_slot5_unit
    name: "homey_t_slot5_unit"
    update_interval: never

  - platform: template
    id: homey_t_slot6_unit
    name: "homey_t_slot6_unit"
    update_interval: never

  - platform: template
    id: homey_t_button1_label
    name: "homey_t_button1_label"
    update_interval: never

  - platform: template
    id: homey_t_button1_state
    name: "homey_t_button1_state"
    update_interval: never

sensor:
  - platform: template
    id: homey_n_primary
    name: "homey_n_primary"
    update_interval: never
    accuracy_decimals: 1


  # Three generic value columns, each paired with a homey_t_col*_label text slot.
  # Homey pushes both the number and its caption, so the node holds no knowledge
  # of which rooms or sensors exist — swapping a sensor is a Flow edit, not a
  # reflash. The node's own SHT4x covers local conditions separately.
  - platform: template
    id: homey_n_slot1_value
    name: "homey_n_slot1_value"
    update_interval: never
    accuracy_decimals: 1

  - platform: template
    id: homey_n_slot2_value
    name: "homey_n_slot2_value"
    update_interval: never
    accuracy_decimals: 1

  - platform: template
    id: homey_n_slot3_value
    name: "homey_n_slot3_value"
    update_interval: never
    accuracy_decimals: 1

  - platform: template
    id: homey_n_slot4_value
    name: "homey_n_slot4_value"
    update_interval: never
    accuracy_decimals: 1

  - platform: template
    id: homey_n_slot5_value
    name: "homey_n_slot5_value"
    update_interval: never
    accuracy_decimals: 1

  - platform: template
    id: homey_n_slot6_value
    name: "homey_n_slot6_value"
    update_interval: never
    accuracy_decimals: 1

api:
  actions:
    # Slots are resolved at runtime: ESPHome stores each entity's object_id as an
    # fnv1 hash, so a slot name coming from Homey can be looked up directly. This
    # is what keeps the convention open-ended — a user adds a template sensor
    # named `${homey_text_prefix}whatever` and it is immediately writable, with no
    # change to this dispatcher and no firmware convention to remember beyond the
    # prefix.
    - action: homey_set_text
      variables:
        slot: string
        value: string
      then:
        - lambda: |-
            // `slot` arrives as a StringRef, which is not guaranteed to be
            // null-terminated; str() is the safe conversion.
            const std::string name = slot.str();
            if (name.rfind("${homey_text_prefix}", 0) != 0) {
              ESP_LOGW("homey", "refusing '%s': text slots must start with %s",
                       name.c_str(), "${homey_text_prefix}");
              return;
            }
            auto *target = App.get_text_sensor_by_key(fnv1_hash(name));
            if (target == nullptr) {
              ESP_LOGW("homey", "no text slot named '%s'", name.c_str());
              return;
            }
            // The display lambda formats slot text into a fixed stack buffer,
            // so a long value from a Flow would smash it during a redraw.
            // Truncate at the only place every write passes through.
            std::string text = value.str();
            if (text.size() > ${homey_text_max}) {
              ESP_LOGW("homey", "truncating '%s' to %d chars",
                       name.c_str(), ${homey_text_max});
              text.resize(${homey_text_max});
            }
            target->publish_state(text);

    - action: homey_set_number
      variables:
        slot: string
        value: float
      then:
        - lambda: |-
            // `slot` arrives as a StringRef, which is not guaranteed to be
            // null-terminated; str() is the safe conversion.
            const std::string name = slot.str();
            if (name.rfind("${homey_number_prefix}", 0) != 0) {
              ESP_LOGW("homey", "refusing '%s': number slots must start with %s",
                       name.c_str(), "${homey_number_prefix}");
              return;
            }
            auto *target = App.get_sensor_by_key(fnv1_hash(name));
            if (target == nullptr) {
              ESP_LOGW("homey", "no number slot named '%s'", name.c_str());
              return;
            }
            target->publish_state(value);

    - action: homey_refresh
      then:
        - component.update: ${homey_display_id}
